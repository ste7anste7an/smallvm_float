[env:esp32-s3-hid]
; ** Experts Only **
; The ARDUINO_USB_MODE=0 setting below allows the Keyboard and Mouse library to be used.
; However, it also makes it impossible to update the firmware on the board except by manually
; booting the board into "bootloader" mode by holding down the "BOOT" button or by grounding
; pin GPIO-0 while resetting or powering up the board. The ARDUINO_USB_MODE=0 setting can be
; used on any ESP32-S3 or ESP32-S2 (i.e. ESP32 boards with built-in USB controllers) but
; because it makes firmware installation more complex it is not the default setting.
; Use at your own risk!
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
board_build.partitions = microblocks_partitions.csv
board_upload.flash_size = 4MB
build_unflags = -D ARDUINO_USB_MODE
build_flags = -D ARDUINO_USB_CDC_ON_BOOT -D ARDUINO_USB_MODE=0 -D NEOPIXEL_PIN_LED=18 -D BLE_IDE
lib_deps =
	moononournation/GFX Library for Arduino@1.6.0
	greiman/SdFat
	paulstoffregen/OneWire
	WebSockets
	256dpi/MQTT
	NimBLE-Arduino@<2

