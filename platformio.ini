; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; To build 'cd' to the the 'smallvm' folder and run a command like:
;	pio run -e microbit -t upload
; to build and install the MicroBlocks VM a given board (e.g. microbit) or
;	pio run
; to compile MicroBlocks for all platforms.
;
; Framework patches:
; The frameworks must be patched to increase their serial buffer sizes:
;
; To do that, run:
;	grep -r "#define SERIAL_BUFFER_SIZE" framework-*
;
; In each file where SERIAL_BUFFER_SIZE is less than 256, change it to 256 bytes in this line:
;	#define SERIAL_BUFFER_SIZE 256
;
; These patches help to avoid dropped bytes if the CPU blocked by a long-running operation such
; as an I2C sensor read with clock stretching or big i2c transfer.
; The maximum tolerable CPU block time is ~20 msecs.
;
; CalliopeV3-ble requires copying a file from another framwork into the n-able-arduino framework:
;  cp -r framework-arduinonordicnrf5/variants/CalliopeminiV3 framework-n-able-arduino/variants
;
; Clue requires a patch to Uart.h to avoid a conflict of the defintion of Serial
; (~/.platformio/packages/framework-arduinoadafruitnrf52/cores/nRF5/Uart.h)
; Use an #ifdef of MICROBLOCKS_FIX_TINY_BLE_CONFLICT to force:
;	#define SERIAL_PORT_HARDWARE Serial1
;
; The following patch is NO LONGER NEEDED:
;  cp framework-arduinoadafruitnrf52/cores/nRF5/linker/gcc_startup_nrf52840.S framework-n-able-arduino/cores/nRF5/nordic/linker/gcc_startup_nrf52840.S
;
; Old platforms (as of Sept 29, 2026):
;	atmel 8.3.0
;	espressif32 3.2.1 (I think)
;	espressif8266 4.2.1
;	nRF51 9.0.0
;	n-able 1.1.0
;	pico github.com/maxgerhardt/platform-raspberrypi.git@1.17.0
;	atmel samd 8.3.0
;	teensy 5.0.0
;	nordicnrf52 10.9.0+sha.10d377a

[platformio]
src_dir = vm

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

[env:microbit]
platform = nordicnrf51@10.0.0
board = bbcmicrobit
; build_flags = -Wl,-Map,output.map
lib_deps =
	moononournation/GFX Library for Arduino@1.6.0

[env:calliope]
platform = nordicnrf51@10.0.0
board = calliope_mini
lib_deps =
	moononournation/GFX Library for Arduino@1.6.0

[env:calliopeV3]
platform = nordicnrf52@11.0.0
board = calliopemini_v3
; Note: Flags -UNRF52 -DNRF52_SERIES are required to make the
; arduinonordicnrf5 framework use code for the NRF52833 chip.
build_flags = -UNRF52 -DNRF52_SERIES -D ARDUINO_GENERIC -D USE_LFSYNT -D CONFIG_NFCT_PINS_AS_GPIOS -D CALLIOPE_V3 -D SD_CARD
lib_deps =
	moononournation/GFX Library for Arduino@1.6.0
	greiman/SdFat

[env:calliopeV3-ble]
platform = https://github.com/h2zero/platform-n-able.git@1.2.0
board = calliopemini_v3
board_build.variants_dir = boards
build_flags = -D CALLIOPE_V3 -D BLE_IDE -D ARDUINO_GENERIC -D SD_CARD
lib_deps =
	moononournation/GFX Library for Arduino@1.6.0
	greiman/SdFat
	NimBLE-Arduino@<2

[env:cpx]
platform = atmelsam@9.0.0
